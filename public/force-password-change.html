<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/vendor/jquery-ui/jquery-ui.min.css" />
    <link rel="stylesheet" href="/static/styles.css" />
    <title>NodeInstruct - Change Password</title>
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-title-row">
          <div class="auth-title">Change Password</div>
          <button type="button" id="themeToggle" class="ghost">Theme</button>
        </div>
        <form id="changeForm">
          <div class="auth-row">
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" autocomplete="new-password" required />
          </div>
          <div class="auth-row">
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" type="password" autocomplete="new-password" required />
          </div>
          <button type="submit" class="primary">Update password</button>
          <div id="error" class="error"></div>
        </form>
      </div>
    </div>

    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/jquery-ui/jquery-ui.min.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/force-password-change.js"></script>
  </body>
</html>
