<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/vendor/jquery-ui/jquery-ui.min.css" />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/cpc-theme.css" />
    <title>Node Instruct - Reset Password</title>
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-title-row">
          <div class="auth-title">Choose a New Password</div>
        </div>
        <form id="resetPasswordForm">
          <div class="auth-row">
            <label for="password">New password</label>
            <input id="password" type="password" autocomplete="new-password" required />
          </div>
          <div class="auth-row">
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" type="password" autocomplete="new-password" required />
          </div>
          <div class="auth-help">Use at least 8 characters with an uppercase letter, a lowercase letter, and a number.</div>
          <button type="submit" class="primary">Reset password</button>
          <div id="message" class="error"></div>
        </form>
        <div class="auth-footer"><a href="/login">Back to login</a></div>
      </div>
    </div>
    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/jquery-ui/jquery-ui.min.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/reset-password.js"></script>
  </body>
</html>
