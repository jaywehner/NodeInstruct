<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/vendor/jquery-ui/jquery-ui.min.css" />
    <link rel="stylesheet" href="/static/styles.css" />
    <title>NodeInstruct - Public Flows</title>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">NodeInstruct</div>
      <div class="flow-name">Public Flows</div>
      <div class="spacer"></div>
      <a href="/" class="ghost-link">Home</a>
      <a href="/app" class="ghost-link">App</a>
      <button type="button" id="themeToggle" class="ghost">Theme</button>
    </div>

    <div style="padding:64px 12px 12px 12px;">
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;">
        <div style="min-width:220px;">
          <label>Filter by username</label>
          <input id="filterUsername" type="text" placeholder="username" />
        </div>
        <div style="min-width:280px;">
          <label>Filter by flow name</label>
          <input id="filterFlowName" type="text" placeholder="flow name" />
        </div>
        <button id="applyFilter" type="button" class="ghost">Apply</button>
        <span id="status" class="status"></span>
      </div>

      <table class="ni-table">
        <thead>
          <tr>
            <th>Flow</th>
            <th>Owner</th>
            <th>Updated</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="publicFlowsBody"></tbody>
      </table>

      <div class="pager-row">
        <button id="prevPage" type="button" class="ghost">Previous</button>
        <span id="pageInfo" class="status"></span>
        <button id="nextPage" type="button" class="ghost">Next</button>
      </div>
    </div>

    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/jquery-ui/jquery-ui.min.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/public-flows.js"></script>
  </body>
</html>
