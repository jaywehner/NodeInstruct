<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/vendor/jquery-ui/jquery-ui.min.css" />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/cpc-theme.css" />
    <title>Node Instruct - Forgot Password</title>
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-title-row">
          <div class="auth-title">Reset Password</div>
        </div>
        <div class="auth-help">Enter your account email and we will send you a password reset link.</div>
        <form id="forgotPasswordForm">
          <div class="auth-row">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </div>
          <button type="submit" class="primary">Send reset link</button>
          <div id="message" class="error"></div>
        </form>
        <div class="auth-footer"><a href="/login">Back to login</a></div>
      </div>
    </div>
    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/jquery-ui/jquery-ui.min.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/forgot-password.js"></script>
  </body>
</html>
